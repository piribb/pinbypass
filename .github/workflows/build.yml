name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download libxposed
        run: |
          mkdir -p app/libs
          curl -L "https://github.com/libxposed/api/releases/download/100/api-release.aar" -o app/libs/libxposed-api.aar || \
          curl -L "https://github.com/libxposed/api/releases/latest/download/api-release.aar" -o app/libs/libxposed-api.aar

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinbypass-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk